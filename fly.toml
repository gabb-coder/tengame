# Fly.io config. Change `app` to a unique name before the first deploy.
app = "tengame"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm: rooms live in memory, so a stopped machine ends every game.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
